services:
  # ==========================================
  # 1. Microservicio Identidad
  # ==========================================
  postgres-identidad:
    image: postgres:16-alpine
    container_name: pei-db-identidad
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: pei_identidad_db
    ports:
      - "5441:5432"
    volumes:
      - db_identidad_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pei_identidad_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. Microservicio Cursos
  # ==========================================
  postgres-cursos:
    image: postgres:16-alpine
    container_name: pei-db-cursos
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: pei_cursos_db
    ports:
      - "5442:5432"
    volumes:
      - db_cursos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pei_cursos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 3. Microservicio Evaluaciones
  # ==========================================
  postgres-evaluaciones:
    image: postgres:16-alpine
    container_name: pei-db-evaluaciones
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: pei_evaluaciones_db
    ports:
      - "5443:5432"
    volumes:
      - db_evaluaciones_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pei_evaluaciones_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 4. Microservicio Sala en Vivo
  # ==========================================
  postgres-sala:
    image: postgres:16-alpine
    container_name: pei-db-sala
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: pei_sala_db
    ports:
      - "5444:5432"
    volumes:
      - db_sala_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pei_sala_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 5. Microservicio IA
  # ==========================================
  postgres-ia:
    image: postgres:16-alpine
    container_name: pei-db-ia
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: pei_ia_db
    ports:
      - "5445:5432"
    volumes:
      - db_ia_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pei_ia_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 6. Redis (Presencia efímera y SignalR)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: pei-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_identidad_data:
  db_cursos_data:
  db_evaluaciones_data:
  db_sala_data:
  db_ia_data:
  redis_data:
