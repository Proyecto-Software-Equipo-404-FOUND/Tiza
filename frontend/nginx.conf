# SignalR negocia por HTTP y después sube a WebSocket: solo se pide "upgrade" cuando el cliente lo pide
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Apuntes en PDF (Cursos)
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La IA puede tardar en sugerir preguntas o corregir
        proxy_read_timeout 120s;
    }

    location /hubs/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
        # Una sala en vivo puede durar toda la clase
        proxy_read_timeout 3h;
        proxy_send_timeout 3h;
    }

    # SPA: cualquier ruta del front (/sala, /mis-examenes/...) devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash se cachean; index.html no, así un rebuild se ve al recargar
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
